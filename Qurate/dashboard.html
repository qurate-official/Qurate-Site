<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Qurate Campus</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Same CDN as auth.html — exposes window.supabase, no name clash -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

  <nav>
    <div class="container">
      <div class="nav-inner">
        <a class="logo" href="dashboard.html">
          <img class="logo-img" src="../items/logo.jpeg" alt="Qurate logo" onerror="this.style.display='none'"/>
        </a>
        <div class="nav-links">
          <a class="nav-link active" href="dashboard.html">My Marketplace</a>
        </div>
        <div class="nav-actions">
          <a class="btn btn-primary btn-sm" href="add-listing.html">
            <i data-lucide="plus"></i><span>Sell Item</span>
          </a>
          <button class="btn btn-outline btn-sm" id="logoutBtn">
            <i data-lucide="log-out"></i><span>Log out</span>
          </button>
          <div class="profile-circle" id="profileCircle" title="My Account"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
    <div class="page-header" style="margin-bottom: 1.5rem;">
      <h1 class="page-title" id="campusTitle">Loading...</h1>
      <p class="page-sub" id="userGreeting"></p>
    </div>

    <div class="dash-stats" id="statsWrapper"></div>

    <div class="tabs">
      <button class="tab active" id="tabListings" onclick="switchTab('listings')">Marketplace</button>
      <button class="tab" id="tabMine" onclick="switchTab('mine')">My Listings</button>
      <button class="tab" id="tabBuyers" onclick="switchTab('buyers')">Chats</button>
    </div>

    <div id="dashboardContent">
      <div class="listing-grid" id="listingsTarget"></div>
      <div class="listing-grid hidden" id="mineTarget"></div>
      <div id="buyersTarget" class="hidden"></div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <style>
    .profile-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--navy, #0b3a79);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .profile-circle:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    #logoutBtn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    #logoutBtn i {
      width: 16px;
      height: 16px;
    }
  </style>

  <script src="supabaseClient.js"></script>
  <script>
    let currentUser = null;
    let currentTab  = 'listings';

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sbClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.getElementById('profileCircle').addEventListener('click', () => {
      window.location.href = "view-account.html";
    });

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await checkUserSession();
      if (!currentUser) return;

      const meta          = currentUser.user_metadata || {};
      const firstName     = meta.first_name || '';
      const lastName      = meta.last_name  || '';
      const school        = meta.school     || 'campus';
      const schoolDisplay = school.charAt(0).toUpperCase() + school.slice(1);

      document.getElementById('campusTitle').textContent  = schoolDisplay;
      document.getElementById('userGreeting').textContent = `Hi, ${firstName} ${lastName}`.trim();

      const initials = `${firstName.charAt(0)}${lastName.charAt(0)}`.toUpperCase()
        || (currentUser.email ? currentUser.email.charAt(0).toUpperCase() : '?');
      document.getElementById('profileCircle').textContent = initials;

      await loadDashboardMetrics();
      await loadMarketplaceListings();
      await loadMyListings();
      await loadBuyerInterests();
      lucide.createIcons();
    });

    async function loadDashboardMetrics() {
      const { data: listings } = await sbClient
        .from('listings')
        .select('price, status')
        .eq('seller_id', currentUser.id);

      const activeCount = listings?.filter(l => l.status === 'available').length || 0;
      const soldCount   = listings?.filter(l => l.status === 'sold').length || 0;
      const totalEarned = listings?.filter(l => l.status === 'sold')
                                   .reduce((sum, l) => sum + l.price, 0) || 0;

      document.getElementById('statsWrapper').innerHTML = `
        <div class="stat-card"><div class="stat-value">${activeCount}</div><div class="stat-label">Active Items</div></div>
        <div class="stat-card"><div class="stat-value">${soldCount}</div><div class="stat-label">Items Sold</div></div>
        <div class="stat-card"><div class="stat-value">₹${totalEarned}</div><div class="stat-label">Total Liquidated</div></div>
      `;
    }

    async function loadMarketplaceListings() {
      const target = document.getElementById('listingsTarget');
      const { data, error } = await sbClient
        .from('listings')
        .select('*')
        .eq('status', 'available');

      if (error || !data || data.length === 0) {
        target.innerHTML = `<p style="padding: 2rem 0; color: var(--ink3);">No listings yet.</p>`;
        return;
      }
      target.innerHTML = data.map(item => listingCard(item)).join('');
    }

    async function loadMyListings() {
      const target = document.getElementById('mineTarget');
      const { data, error } = await sbClient
        .from('listings')
        .select('*')
        .eq('seller_id', currentUser.id);

      if (error || !data || data.length === 0) {
        target.innerHTML = `<p style="padding: 2rem 0; color: var(--ink3);">You haven't listed anything yet. Hit "Sell Item" to start.</p>`;
        return;
      }
      target.innerHTML = data.map(item => listingCard(item)).join('');
    }

    function listingCard(item) {
      return `
        <div class="listing-card" onclick="window.open('listing.html?id=${item.id}','_blank')" style="cursor:pointer;">
          <img class="listing-img" src="${item.images?.[0] || 'placeholder.jpg'}" alt="${item.title}">
          <div class="listing-body">
            <div class="listing-title">${item.title}</div>
            <div class="listing-price">₹${item.price}</div>
            <div style="margin-top:0.5rem;display:flex;align-items:center;gap:0.5rem;">
              <span class="badge ${item.status === 'available' ? 'badge-green' : 'badge-red'}">${item.status}</span>
              ${item.ai_score != null ? `<span class="badge" style="background:#e8f0fe;color:#1252a3;">AI ${item.ai_score}/100</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    async function loadBuyerInterests() {
      const target = document.getElementById('buyersTarget');

      const { data: myListings } = await sbClient
        .from('listings')
        .select('id, title, price, chat_unlocked')
        .eq('seller_id', currentUser.id);

      const myIds = myListings?.map(l => l.id) || [];
      const listingMap = Object.fromEntries((myListings || []).map(l => [l.id, l]));

      // Enquiries where I'm the seller
      let assellerRaw = [];
      if (myIds.length) {
        const { data } = await sbClient.from('interests').select('*').in('listing_id', myIds);
        assellerRaw = data || [];
      }
      const asseller = assellerRaw;

      // Enquiries where I'm the buyer
      const { data: asbuyerRaw } = await sbClient
        .from('interests')
        .select('*')
        .eq('buyer_id', currentUser.id);
      const asbuyer = asbuyerRaw || [];

      // Fetch listing info for buyer rows
      const buyerListingIds = asbuyer.map(r => r.listing_id);
      let buyerListingMap = {};
      if (buyerListingIds.length) {
        const { data: buyerListings } = await sbClient
          .from('listings')
          .select('id, title, price, chat_unlocked')
          .in('id', buyerListingIds);
        buyerListingMap = Object.fromEntries((buyerListings || []).map(l => [l.id, l]));
      }

      const sellerRows = asseller.map(r => ({ ...r, role: 'seller', listing: listingMap[r.listing_id] }));
      const buyerRows  = asbuyer.map(r => ({ ...r, role: 'buyer', listing: buyerListingMap[r.listing_id] }));
      const all = [...sellerRows, ...buyerRows]
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      if (all.length === 0) {
        target.innerHTML = `<p style="padding:2rem;color:var(--ink3);">No chats yet.</p>`;
        return;
      }

      target.innerHTML = all.map(r => {
        const title = r.listing?.title || 'Unknown listing';
        const unlocked = r.listing?.chat_unlocked;

        if (unlocked) {
          return `
            <div class="buyer-row" onclick="window.location.href='chat.html?id=${r.id}'" style="cursor:pointer;">
              <div style="flex:1;">
                <p style="font-weight:600;color:var(--navy);">Enquiry for ${title}</p>
              </div>
              <div style="display:flex;align-items:center;">
                <i data-lucide="chevron-right" style="color:#888;"></i>
              </div>
            </div>`;
        }

        if (r.role === 'seller') {
          const amount = Math.round((r.listing?.price || 0) * 0.05);
          return `
            <div class="buyer-row">
              <div style="flex:1;">
                <p style="font-weight:600;color:var(--navy);">Enquiry for ${title}</p>
                <p style="font-size:0.8rem;color:var(--ink3);margin-top:0.25rem;">Chat locked — unlock for ₹${amount} to reply to buyers</p>
              </div>
              <button class="btn btn-primary btn-sm" onclick="unlockChat('${r.listing_id}')">Unlock</button>
            </div>`;
        }

        return `
          <div class="buyer-row" style="opacity:0.65;">
            <div style="flex:1;">
              <p style="font-weight:600;color:var(--navy);">Enquiry for ${title}</p>
              <p style="font-size:0.8rem;color:var(--ink3);margin-top:0.25rem;">Waiting for seller to unlock chat</p>
            </div>
          </div>`;
      }).join('');

      lucide.createIcons();
    }

    async function unlockChat(listingId) {
      const { data: { session } } = await sbClient.auth.getSession();

      const orderRes = await fetch('https://wppqwnxtojovegfcdewr.supabase.co/functions/v1/create-razorpay-order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ listing_id: listingId }),
      });
      const order = await orderRes.json();
      if (order.error) { toast(order.error, 'error'); return; }

      const rzp = new Razorpay({
        key: order.key_id,
        amount: order.amount,
        currency: order.currency,
        order_id: order.order_id,
        name: "Qurate",
        description: "Unlock chat for listing",
        handler: async function (response) {
          const verifyRes = await fetch('https://wppqwnxtojovegfcdewr.supabase.co/functions/v1/verify-razorpay-payment', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`,
            },
            body: JSON.stringify({
              listing_id: listingId,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
            }),
          });
          const result = await verifyRes.json();
          if (result.success) {
            toast('Chat unlocked!', 'success');
            await loadBuyerInterests();
          } else {
            toast('Verification failed: ' + (result.error || 'unknown error'), 'error');
          }
        },
        theme: { color: "#0b3a79" },
      });
      rzp.open();
    }

    function switchTab(mode) {
      currentTab = mode;
      ['listings', 'mine', 'buyers'].forEach(t => {
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('active', t === mode);
        document.getElementById(`${t}Target`).classList.toggle('hidden', t !== mode);
      });
    }
  </script>
</body>
</html>
